<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generate strong, random passwords in your browser.">
    <title>The Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="stripts.js" defer></script>
</head>
    <body>

        <div class="pw-container">
            <h1>The Password Generator</h1>
            <div class="pw-header">
                <div class="pw">
                    <span id="pw" aria-live="polite">l823Zs78#Css09@</span>
                    <button id="copy" type="button" aria-label="Copy password to clipboard">Copy</button>
                </div>
                <div class="strength">
                    <div class="strength-bar"><span id="strength-fill"></span></div>
                    <p id="strength-text">Strength: –</p>
                </div>
            </div>
            <div class="pw-body">
                <div class="form-control">
                    <label for="len">Password Length <small>(4–64)</small></label>
                    <input id="len" value="15" type="number" min="4" max="64" />
                </div>
                <div class="form-control">
                    <label for="upper">Contain Uppercase Letters</label>
                    <input id="upper" type="checkbox" checked />
                </div>
                <div class="form-control">
                    <label for="lower">Contain Lowercase Letters</label>
                    <input id="lower" type="checkbox" checked />
                </div>
                <div class="form-control">
                    <label for="number">Contain Numbers</label>
                    <input id="number" type="checkbox" checked />
                </div>
                <div class="form-control">
                    <label for="symbol">Contain Symbols</label>
                    <input id="symbol" type="checkbox" checked />
                </div>
                <p class="feedback" id="feedback" role="status"></p>
                <button class="generate" id="generate" type="button">
                    Generate Password
                </button>
            </div>
        </div>
    </body>
</html>
