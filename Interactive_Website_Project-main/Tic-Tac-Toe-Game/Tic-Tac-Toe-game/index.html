<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Classic two-player Tic Tac Toe in the browser.">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="wrapper">
        <h1 class="title">Tic Tac Toe</h1>
        <div class="scoreboard" aria-label="Scoreboard">
            <span>X: <b id="score-x">0</b></span>
            <span>Draws: <b id="score-draw">0</b></span>
            <span>O: <b id="score-o">0</b></span>
        </div>
        <div class="container" role="grid" aria-label="Game board">
            <button type="button" data-cell-index="0" class="cell" aria-label="Cell 1"></button>
            <button type="button" data-cell-index="1" class="cell" aria-label="Cell 2"></button>
            <button type="button" data-cell-index="2" class="cell" aria-label="Cell 3"></button>
            <button type="button" data-cell-index="3" class="cell" aria-label="Cell 4"></button>
            <button type="button" data-cell-index="4" class="cell" aria-label="Cell 5"></button>
            <button type="button" data-cell-index="5" class="cell" aria-label="Cell 6"></button>
            <button type="button" data-cell-index="6" class="cell" aria-label="Cell 7"></button>
            <button type="button" data-cell-index="7" class="cell" aria-label="Cell 8"></button>
            <button type="button" data-cell-index="8" class="cell" aria-label="Cell 9"></button>
        </div>
        <h2 class="status" id="status" aria-live="polite"></h2>
        <button class="restart" type="button">Restart</button>
    </div>
</body>
</html>
