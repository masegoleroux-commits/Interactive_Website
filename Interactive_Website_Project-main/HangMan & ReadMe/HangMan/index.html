<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hangman with a Mzansi twist: guess South African football words.">
    <title>Hangman Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="word-l.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="game-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="content">
            <img src="images/loser-online.gif" alt="">
            <h4 id="modal-title">Game Over!</h4>
            <p>The correct word was: <b></b></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>
    <div class="container">
        <div class="hangman-box">
            <img src="images/hangman-0.svg" draggable="false" alt="Hangman drawing">
            <h1>Hangman Game</h1>
            <p class="score">Wins: <b class="wins">0</b> &middot; Losses: <b class="losses">0</b></p>
        </div>
        <div class="game-box">
            <ul class="word-display" aria-label="Hidden word"></ul>
            <h4 class="hint-text">Hint: <b></b></h4>
            <h4 class="guesses-text">Incorrect guesses: <b></b></h4>
            <div class="keyboard" aria-label="Letter keyboard"></div>
            <p class="tip">Tip: you can also type letters on your keyboard.</p>
        </div>
    </div>
</body>
</html>
