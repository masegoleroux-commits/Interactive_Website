<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A pixel art editor in the browser: draw, fill, mirror, undo and export PNGs.">
    <title>Pixel Art Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Pixel Art Studio</h1>
        <p>Draw retro sprites, then download them as a PNG.</p>
    </header>

    <main class="studio">
        <aside class="panel tools" aria-label="Tools">
            <h2>Tools</h2>
            <div class="tool-grid">
                <button type="button" class="tool active" data-tool="pencil" title="Pencil (B)">✏️<span>Pencil</span></button>
                <button type="button" class="tool" data-tool="eraser" title="Eraser (E)">🧽<span>Eraser</span></button>
                <button type="button" class="tool" data-tool="fill" title="Fill bucket (G)">🪣<span>Fill</span></button>
                <button type="button" class="tool" data-tool="picker" title="Colour picker (I)">💧<span>Picker</span></button>
                <button type="button" class="tool" data-tool="line" title="Line (L)">📏<span>Line</span></button>
                <button type="button" class="tool" data-tool="rect" title="Rectangle (R)">⬜<span>Box</span></button>
            </div>

            <h2>Options</h2>
            <label class="toggle"><input type="checkbox" id="mirror"> Mirror drawing ↔</label>
            <label class="toggle"><input type="checkbox" id="show-grid" checked> Show grid</label>
            <label class="field">Canvas size
                <select id="size">
                    <option value="16">16 × 16</option>
                    <option value="24">24 × 24</option>
                    <option value="32" selected>32 × 32</option>
                    <option value="48">48 × 48</option>
                </select>
            </label>

            <div class="history-btns">
                <button type="button" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
                <button type="button" id="redo" title="Redo (Ctrl+Y)">↷ Redo</button>
            </div>
            <button type="button" id="clear" class="danger">Clear canvas</button>
        </aside>

        <section class="canvas-area">
            <div class="canvas-frame">
                <canvas id="canvas" width="512" height="512" aria-label="Drawing canvas"></canvas>
                <canvas id="overlay" width="512" height="512" aria-hidden="true"></canvas>
            </div>
            <p class="coords" id="coords">x: – y: –</p>
        </section>

        <aside class="panel colours" aria-label="Colours">
            <h2>Colour</h2>
            <div class="current">
                <input type="color" id="color" value="#007a4d" aria-label="Custom colour">
                <span id="color-hex">#007A4D</span>
            </div>
            <h3>Mzansi palette</h3>
            <div class="palette" id="palette"></div>
            <h3>Recent</h3>
            <div class="palette" id="recent"></div>

            <h2>Export</h2>
            <label class="field">Scale
                <select id="scale">
                    <option value="1">1× (tiny)</option>
                    <option value="8">8×</option>
                    <option value="16" selected>16×</option>
                    <option value="32">32×</option>
                </select>
            </label>
            <button type="button" id="download" class="primary">⬇ Download PNG</button>
            <p class="preview-label">Preview</p>
            <canvas id="preview" width="64" height="64" aria-label="Actual size preview"></canvas>
        </aside>
    </main>
    <p class="toast" id="toast" role="status"></p>
</body>
</html>
