<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A live countdown to New Year's Day.">
    <title>Countdown Timer</title>
    <!-- Relative paths so the page works when opened locally AND on GitHub Pages -->
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Countdown To <span id="target-year">New Year</span></h1>

    <div class="countdown-container" aria-live="polite">
        <div class="countdown-el days-c">
            <p class="big-text" id="days">0</p>
            <span>Days</span>
        </div>

        <div class="countdown-el hours-c">
            <p class="big-text" id="hours">00</p>
            <span>Hours</span>
        </div>

        <div class="countdown-el mins-c">
            <p class="big-text" id="mins">00</p>
            <span>Mins</span>
        </div>

        <div class="countdown-el seconds-c">
            <p class="big-text" id="seconds">00</p>
            <span>Seconds</span>
        </div>
    </div>

    <p class="message" id="message" hidden>🎉 Happy New Year! 🎉</p>
</body>

</html>
